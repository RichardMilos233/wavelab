name: wavelab
channels: [conda-forge]
dependencies:
  # numpy pinned <2.4: numpy 2.4.x breaks matplotlib's compiled ABI (native
  # crash on Windows). matplotlib pinned <3.11 for the same reason.
  # Verified working: numpy 2.3.5 + matplotlib 3.10.8.
  - python=3.12
  - "numpy<2.4"
  - "matplotlib<3.11"
  - pytest
